# Deep-teal base theme. Fine-grained styling lives in cockpit.CSS, but setting
# the base here avoids a white flash and themes Streamlit's own chrome
# (sidebar, sliders, segmented controls, focus rings) with the teal accent.
# Mirrors cockpit.py ACCENT / BG / SURFACE / TEXT.
[theme]
base = "dark"
primaryColor = "#3FB6A8"
backgroundColor = "#0C1A1A"
secondaryBackgroundColor = "#112A2B"
textColor = "#E6F2F1"
font = "sans serif"
