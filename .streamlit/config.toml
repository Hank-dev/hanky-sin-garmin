# "Graphite Voltage" base theme. Fine-grained styling lives in cockpit.CSS, but
# setting the base here avoids a white flash and themes Streamlit's own chrome
# (sidebar, sliders, segmented controls, focus rings) with the volt-lime accent.
# Mirrors cockpit.py ACCENT / BG / SURFACE / TEXT.
[theme]
base = "dark"
primaryColor = "#C6F23B"
backgroundColor = "#121316"
secondaryBackgroundColor = "#1C1F24"
textColor = "#E8ECEF"
font = "sans serif"
