[package]
name = "garmin-coach-desktop"
version = "0.1.0"
edition = "2021"
description = "Native offline Garmin Coach SQLite desktop client"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.33.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
